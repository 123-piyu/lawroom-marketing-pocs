const tabs = document.getElementById("tabs");
const sections = document.getElementById("sections");
const resizeFrames = [];
function makeVisible(index){
  demos.forEach((demo,i)=>{
    const button=tabs.children[i],section=document.getElementById("demo-"+i),active=i===index;
    button.setAttribute("aria-selected",String(active));
    button.tabIndex=active?0:-1;
    section.hidden=!active;
  });
  resizeFrames[index]?.();
}
demos.forEach((demo,index)=>{
  const button=document.createElement("button");
  button.type="button";button.id="tab-"+index;button.role="tab";
  button.setAttribute("aria-controls","demo-"+index);
  button.setAttribute("aria-selected",String(index===0));button.tabIndex=index===0?0:-1;
  button.textContent=demo.title;
  button.addEventListener("click",()=>makeVisible(index));
  button.addEventListener("keydown",event=>{
    if(event.key!=="ArrowLeft"&&event.key!=="ArrowRight")return;
    event.preventDefault();const step=event.key==="ArrowRight"?1:-1;
    const next=(index+step+demos.length)%demos.length;tabs.children[next].focus();makeVisible(next);
  });
  tabs.appendChild(button);

  const section=document.createElement("section");
  section.className="section";section.id="demo-"+index;
  section.setAttribute("role","tabpanel");section.setAttribute("aria-labelledby","tab-"+index);
  section.hidden=index!==0;
  const heading=document.createElement("div");heading.className="section-head";
  const text=document.createElement("div"),title=document.createElement("h2"),description=document.createElement("p");
  title.textContent=demo.title;description.textContent=demo.description;text.append(title,description);
  const source=document.createElement("span");source.className="source";source.textContent="Source: "+demo.file;
  heading.append(text,source);
  const frameWrap=document.createElement("div");frameWrap.className="demo";
  const frame=document.createElement("iframe");frame.title=demo.title;frame.loading="lazy";
  frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(demo.data),character=>character.charCodeAt(0)));
  frameWrap.appendChild(frame);section.append(heading,frameWrap);sections.appendChild(section);
  frame.addEventListener("load",()=>{
    const measure=()=>{
      try{const doc=frame.contentDocument;if(!doc)return;
        frame.style.height=Math.max(500,doc.documentElement.scrollHeight,doc.body?.scrollHeight||0)+"px";
      }catch(error){console.error("Could not measure the embedded demo frame",error)}
    };
    resizeFrames[index]=measure;
    measure();
    const doc=frame.contentDocument;
    if(doc&&"ResizeObserver"in window){const observer=new ResizeObserver(measure);observer.observe(doc.documentElement);if(doc.body)observer.observe(doc.body);frame._resizeObserver=observer}
    if(doc&&doc.body&&"MutationObserver"in window){const observer=new MutationObserver(measure);observer.observe(doc.body,{childList:true,subtree:true,attributes:true,characterData:true});frame._mutationObserver=observer}
    frame.contentWindow.addEventListener("resize",measure);
  });
});
